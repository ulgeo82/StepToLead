services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: steptolead
      POSTGRES_USER: steptolead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steptolead -d steptolead"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://steptolead:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/steptolead
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET in .env.prod}
      FRONTEND_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.prod}
      SESSION_COOKIE_SECURE: "true"
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      RECORDINGS_DIR: /app/data/recordings
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_CHAT: ${LLM_MODEL_CHAT:-}
      LLM_MODEL_SUMMARY: ${LLM_MODEL_SUMMARY:-}
      LLM_MODEL_CALLS: ${LLM_MODEL_CALLS:-}
      LLM_MODEL_CAMPAIGNS: ${LLM_MODEL_CAMPAIGNS:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-24000}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-0}
      AI_WORKSPACE_DAILY_TOKEN_LIMIT: ${AI_WORKSPACE_DAILY_TOKEN_LIMIT:-0}
      AI_PRICES: ${AI_PRICES:-}
      AGENCY_WORKSPACE_ID: ${AGENCY_WORKSPACE_ID:-0}
      BRIEF_DEMO_TTL_DAYS: ${BRIEF_DEMO_TTL_DAYS:-14}
      BRIEF_DEMO_DAILY_CAP: ${BRIEF_DEMO_DAILY_CAP:-30}
      BRIEF_BOOKING_URL: ${BRIEF_BOOKING_URL:-/contact}
      BRIEF_PRIVACY_URL: ${BRIEF_PRIVACY_URL:-}
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_RESPONSE_FORMAT: ${STT_RESPONSE_FORMAT:-verbose_json}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - call_recordings:/app/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nightly database backup: /backups inside the volume, 14 days kept. Copy them off the server as well.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - db_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/steptolead-$$(date +%Y-%m-%d_%H%M).sql.gz
          if pg_dump -h postgres -U steptolead -d steptolead | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup ok $$f"; else rm -f "$$f.tmp"; echo "backup FAILED"; fi
          find /backups -name 'steptolead-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_prod_data:/data
      - caddy_prod_config:/config
    depends_on:
      - frontend

volumes:
  db_backups:
  call_recordings:
  postgres_prod_data:
  redis_prod_data:
  caddy_prod_data:
  caddy_prod_config:
