services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-outreach}
      POSTGRES_USER: ${POSTGRES_USER:-outreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outreach}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outreach} -d ${POSTGRES_DB:-outreach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://outreach:outreach@postgres:5432/outreach}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-change-this-before-production}
      ACCOUNT_STATUS_INTERVAL: ${ACCOUNT_STATUS_INTERVAL:-20}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_CHAT: ${LLM_MODEL_CHAT:-}
      LLM_MODEL_SUMMARY: ${LLM_MODEL_SUMMARY:-}
      LLM_MODEL_CALLS: ${LLM_MODEL_CALLS:-}
      LLM_MODEL_CAMPAIGNS: ${LLM_MODEL_CAMPAIGNS:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-24000}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-0}
      AI_WORKSPACE_DAILY_TOKEN_LIMIT: ${AI_WORKSPACE_DAILY_TOKEN_LIMIT:-0}
      AI_PRICES: ${AI_PRICES:-}
      AGENCY_WORKSPACE_ID: ${AGENCY_WORKSPACE_ID:-0}
      BRIEF_DEMO_TTL_DAYS: ${BRIEF_DEMO_TTL_DAYS:-14}
      BRIEF_DEMO_DAILY_CAP: ${BRIEF_DEMO_DAILY_CAP:-30}
      BRIEF_BOOKING_URL: ${BRIEF_BOOKING_URL:-/contact}
      BRIEF_PRIVACY_URL: ${BRIEF_PRIVACY_URL:-}
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_RESPONSE_FORMAT: ${STT_RESPONSE_FORMAT:-verbose_json}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_GROWTH_CONTACT_URL: ${NEXT_PUBLIC_GROWTH_CONTACT_URL:-/contact}
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    tmpfs:
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
